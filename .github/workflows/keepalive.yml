name: Keep Supabase awake

# Free Supabase projects pause after a week without traffic, which would take
# the gallery and Host studio offline. A tiny public read every few days
# keeps the project active.

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the public gallery
        run: |
          url=$(grep -oE 'supabaseUrl: *"[^"]+"' public/assets/js/site-config.js | cut -d'"' -f2)
          key=$(grep -oE 'supabaseKey: *"[^"]+"' public/assets/js/site-config.js | cut -d'"' -f2)
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            "$url/rest/v1/gallery_images?select=id&limit=1&apikey=$key" > /dev/null
          echo "Supabase responded."
